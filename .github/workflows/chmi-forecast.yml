name: Build direct CHMI and ECMWF forecast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chmi-forecast.yml"
      - "tools/build_forecast.py"
  schedule:
    - cron: "30 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aladin-forecast-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB tools
        run: python -m pip install --upgrade pip requests eccodes ecmwf-opendata
      - name: Check browser JavaScript syntax
        run: node --check app.js && node --check sw.js
      - name: Download and process official model data
        run: python tools/build_forecast.py
      - name: Publish forecast JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          if git diff --cached --quiet; then
            echo "Forecast data did not change."
          else
            git commit -m "Update direct CHMI and ECMWF forecast data"
            git pull --rebase origin main
            git push
          fi
