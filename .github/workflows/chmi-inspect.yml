name: Inspect direct CHMI ALADIN data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chmi-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GRIB decoder
        run: python -m pip install --upgrade pip requests eccodes
      - name: Inspect current CHMI ALADIN run
        run: python tools/inspect_chmi_aladin.py
